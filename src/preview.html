<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarGoFast - Kenney Nature Kit (CC0) preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 12px system-ui, sans-serif; background: #1e1e1e; color: #eee; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #labels div { position: absolute; transform: translate(-50%, 0); padding: 1px 4px; background: rgba(0,0,0,.6); border-radius: 3px; white-space: nowrap; pointer-events: none; font-size: 11px; }
    nav { position: fixed; top: 0; left: 0; right: 0; padding: 6px; background: rgba(0,0,0,.7); display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; }
    nav a { color: #cfe8cf; text-decoration: none; padding: 2px 6px; border: 1px solid #456; border-radius: 3px; }
    nav a[aria-current="page"] { background: #3b6e3f; color: #fff; }
  </style>
</head>
<body>
  <nav id="nav" aria-label="Categories"></nav>
  <canvas id="view"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // *** PREVIEW SETTINGS ***
    // URL: /preview.html?prefix=bridge  (prefix = start of model name; omit to list categories only)
    const BG_COLOR      = 0xd2f7ff;
    const CELL          = 1.6;   // world units between models
    const COLUMNS       = 8;
    const LABEL_OFFSET  = 0.0;   // extra z shift of labels, world units
    const CAMERA_PITCH  = 0.9;   // camera height factor (higher = more top-down)

    const params = new URLSearchParams(location.search);
    const prefix = params.get('prefix') ?? '';
    const canvas = document.getElementById('view');
    const labels = document.getElementById('labels');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x557755, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(5, 10, 6);
    scene.add(sun);

    const manifest = await (await fetch('nature/manifest.json')).json();
    const categories = [...new Set(manifest.map((m) => m.name.split('-')[0]))];
    document.getElementById('nav').innerHTML = categories
      .map((c) => `<a href="?prefix=${c}" ${c === prefix ? 'aria-current="page"' : ''}>${c} (${manifest.filter((m) => m.name.startsWith(c + '-') || m.name === c).length})</a>`)
      .join('');

    const items = prefix ? manifest.filter((m) => m.name === prefix || m.name.startsWith(prefix + '-')) : [];
    const loader = new GLTFLoader();
    const anchors = [];
    const rows = Math.ceil(items.length / COLUMNS) || 1;
    await Promise.all(items.map(async (m, i) => {
      const gltf = await loader.loadAsync(`nature/${m.name}.glb`);
      const x = (i % COLUMNS) * CELL;
      const z = Math.floor(i / COLUMNS) * CELL;
      gltf.scene.traverse((o) => { if (o.isMesh) { o.material.metalness = 0; o.material.roughness = 0.9; } }); // kit exports metalness 1 (looks black without an env map)
      gltf.scene.position.set(x, 0, z);
      scene.add(gltf.scene);
      const div = document.createElement('div');
      div.textContent = m.name.slice(prefix.length + 1) || m.name;
      labels.append(div);
      anchors.push({ div, pos: new THREE.Vector3(x, -0.05, z + CELL * 0.45 + LABEL_OFFSET) });
    }));

    const grid = new THREE.Mesh(new THREE.PlaneGeometry(COLUMNS * CELL + 4, rows * CELL + 4), new THREE.MeshStandardMaterial({ color: 0x5fa64a, roughness: 1 }));
    grid.rotation.x = -Math.PI / 2;
    grid.position.set(((COLUMNS - 1) * CELL) / 2, -0.06, ((rows - 1) * CELL) / 2);
    scene.add(grid);

    const center = new THREE.Vector3(((Math.min(items.length, COLUMNS) - 1) * CELL) / 2, 0.2, ((rows - 1) * CELL) / 2);
    controls.target.copy(center);
    const span = Math.max(COLUMNS * CELL, rows * CELL);
    camera.position.set(center.x, span * CAMERA_PITCH + 2, center.z + span * 0.55);

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    const tmp = new THREE.Vector3();
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      anchors.forEach(({ div, pos }) => {
        tmp.copy(pos).project(camera);
        div.style.left = `${((tmp.x + 1) / 2) * innerWidth}px`;
        div.style.top = `${((1 - tmp.y) / 2) * innerHeight}px`;
      });
    });
  </script>
</body>
</html>
